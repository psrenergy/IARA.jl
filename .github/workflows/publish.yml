name: Publish
on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Build windows"
        required: true
        type: boolean
        default: true
      linux:
        description: "Build linux"
        required: true
        type: boolean
        default: true
      development_stage:
        type: choice
        description: "Development stage"
        required: true
        options:
          - Alpha
          - Beta
          - RC
          - Stable
      version_suffix:
        description: "Version suffix (ignored if stable)"
        type: string
        required: false
      overwrite:
        description: "Overwrite"
        required: true
        type: boolean
        default: false
      docker_only:
        description: "Skip builds and only publish Docker image"
        required: true
        type: boolean
        default: false

env:
  HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
  SLACK_BOT_USER_OAUTH_ACCESS_TOKEN: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}

jobs:
  pre-publish:
    name: Tag check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: psrenergy/assert-tag@v1

  build-publish-os:
    strategy:
      fail-fast: true
      matrix:
        os: [windows, linux]
    name: Build and publish ${{ matrix.os }}
    needs: [pre-publish]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        if: inputs[matrix.os] == true
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - uses: psrenergy/setup-git-token@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # GitHub-hosted runners have no juliaup, which the `julia +1.11.9` calls below need.
      # 1.11.9 is the version compile/Manifest.toml was resolved with. 1.11.2 does not start
      # on ubuntu-latest (Ubuntu 26.04), whose glibc refuses its libopenlibm.so because that
      # library asks for an executable stack.
      - uses: julia-actions/install-juliaup@v3
        if: inputs[matrix.os] == true
        with:
          channel: '1.11.9'

      # The Julia depot starts empty on every run. Installing the compile environment before
      # the AWS step keeps that time out of the role's one-hour session, which the ECS build
      # has to fit in.
      - name: Install the compile environment
        if: inputs[matrix.os] == true
        run: julia +1.11.9 --project=./compile -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Configure AWS credentials (assume role)
        if: inputs[matrix.os] == true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::747020361772:role/IARA.jl-actions-role
          role-session-name: iara-publish-${{ matrix.os }}
          aws-region: us-east-1

      - name: Start AWS ECS instance
        if: inputs[matrix.os] == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia +1.11.9 --project=./compile ./compile/ecs.jl --development_stage "${{ inputs.development_stage }}" --version_suffix "${{ inputs.version_suffix }}" --overwrite "${{ inputs.overwrite }}" --docker_only "${{ inputs.docker_only }}" --os ${{ matrix.os }}

  post-publish:
    if: inputs.development_stage == 'Stable'
    name: Create release
    runs-on: ubuntu-latest
    needs: [build-publish-os]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: psrenergy/create-tag-and-release@v1

  notify-failure:
    name: Notify Slack on failure
    if: failure()
    needs:
      - pre-publish
      - build-publish-os
      - post-publish
    runs-on: ubuntu-latest
    steps:
      - uses: psrenergy/notify-on-failure@v1
        with:
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          channel: C05FS4ZJYLU
